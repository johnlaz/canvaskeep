<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="t d">
  <title id="t">How CanvasKeep works</title>
  <desc id="d">Three steps: snap a photo, pick the child, and watch it shine in the gallery. Everything stays on your device, with an optional backup file.</desc>
  <rect width="1200" height="380" rx="24" fill="#FFF9F0"/>
  <g font-family="Trebuchet MS,Verdana,sans-serif" text-anchor="middle">
    <g transform="translate(40 40)">
      <rect width="340" height="230" rx="22" fill="#fff" stroke="#E7DDF7" stroke-width="2"/>
      <circle cx="170" cy="62" r="34" fill="#9B5DE5"/><text x="170" y="74" font-size="32" fill="#fff" font-weight="800">1</text>
      <text x="170" y="136" font-size="26" font-weight="800" fill="#2D2B55">Snap a photo</text>
      <text x="170" y="170" font-size="17" fill="#6B6890">Point your camera at any</text><text x="170" y="194" font-size="17" fill="#6B6890">drawing or painting</text>
    </g>
    <g transform="translate(430 40)">
      <rect width="340" height="230" rx="22" fill="#fff" stroke="#E7DDF7" stroke-width="2"/>
      <circle cx="170" cy="62" r="34" fill="#4ECDC4"/><text x="170" y="74" font-size="32" fill="#fff" font-weight="800">2</text>
      <text x="170" y="136" font-size="26" font-weight="800" fill="#2D2B55">Pick the child</text>
      <text x="170" y="170" font-size="17" fill="#6B6890">Age and grade are worked</text><text x="170" y="194" font-size="17" fill="#6B6890">out for you automatically</text>
    </g>
    <g transform="translate(820 40)">
      <rect width="340" height="230" rx="22" fill="#fff" stroke="#E7DDF7" stroke-width="2"/>
      <circle cx="170" cy="62" r="34" fill="#FF6B6B"/><text x="170" y="74" font-size="32" fill="#fff" font-weight="800">3</text>
      <text x="170" y="136" font-size="26" font-weight="800" fill="#2D2B55">Watch it shine</text>
      <text x="170" y="170" font-size="17" fill="#6B6890">Every piece gets its own</text><text x="170" y="194" font-size="17" fill="#6B6890">museum-style frame</text>
    </g>
    <path d="M388 155h34m-8-8l8 8-8 8M778 155h34m-8-8l8 8-8 8" stroke="#9B5DE5" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="298" width="1120" height="52" rx="26" fill="#F0E8FB"/>
    <text x="600" y="331" font-size="20" fill="#4B3A7A">Stays on your device. Back up to a file anytime and restore it on any phone.</text>
  </g>
</svg>
